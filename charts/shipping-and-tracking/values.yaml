# Default values for shipping-and-tracking. Default component: the api
# Deployment (cmd/api: HTTP, outbox relay, four Kafka consumers and the
# periodic jobs). Two optional components, both off by default: the read-only
# MCP server (cmd/mcp, ADR 0006), the A2A server (cmd/a2a, ADR 0009) and the web
# remote (web/, ADR 0007).

replicaCount: 1

# The same image carries /app/api (the only binary this chart runs).
image:
  repository: warehouse/shipping-and-tracking
  pullPolicy: IfNotPresent
  tag: "local"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as uid/gid 1000 and writes nothing to disk (migrations are
# embedded, logs go to stdout), so the root filesystem is read-only.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: shipping-and-tracking.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Additive, disabled-by-default alternative to ingress. Routes only to the api
# Service.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler for the api Deployment, off by default. When on, the
# Deployment omits replicas. More than one replica is safe by design (outbox
# relay claims rows with SKIP LOCKED, stable consumer groups, inbox dedupe in
# the handler transaction) but has not been load-tested.
autoscaling:
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# Environment read by cmd/api (cmd/api/config.go). Every key maps 1:1 to one
# env var; tests/render_test.sh asserts that every variable the binary reads is
# rendered. Nothing secret lives here: the ConfigMap is not for DSNs, the
# ship-to encryption key or the stopKey secret (see database: and crypto:).
config:
  httpAddr: ":8080"                  # HTTP_ADDR
  logLevel: "info"                   # LOG_LEVEL: debug | info | warn | error
  # EVENT_PUBLISHER: "kafka" is the only publisher; the outbox relay always
  # runs. The key stays because the deployment sets it; "log" is refused at
  # render and by the binary at boot.
  eventPublisher: "kafka"
  # CUSTOMER_ORDERING_URL: base URL of customer-ordering (GetShipTo over
  # HTTP). REQUIRED. Not a secret and not PII; the ship-to the call returns is
  # synthetic personal data and is never logged or stored in clear.
  customerOrderingUrl: ""
  # CUSTOMER_ORDERING_TIMEOUT: one GetShipTo call, Go duration or seconds.
  # Empty = not rendered; the binary defaults to 3s.
  customerOrderingTimeout: ""
  # The four consumers' STABLE group ids (service-prefixed, never the pod name),
  # so a rescheduled pod resumes from its committed offsets. ALL REQUIRED:
  # an empty one fails the render and the binary refuses to boot.
  vendorConsumerGroup: ""            # VENDOR_CONSUMER_GROUP
  linehaulConsumerGroup: ""          # LINEHAUL_CONSUMER_GROUP
  lastmileConsumerGroup: ""          # LASTMILE_CONSUMER_GROUP
  catalogConsumerGroup: ""           # CATALOG_CONSUMER_GROUP
  # OUTBOX_RELAY_INTERVAL: Go duration or seconds. Empty = not rendered (1s).
  outboxRelayInterval: ""
  # OUTBOX_MAX_ATTEMPTS: failures before the relay excludes a row; 0 = unlimited.
  outboxMaxAttempts: 20
  # SILENCE_SWEEP_INTERVAL: exception-on-silence sweep period. Empty = 5m.
  silenceSweepInterval: ""
  # HOUSEKEEPING_INTERVAL: ship-to and technical-table purge period. Empty = 1h.
  housekeepingInterval: ""
  # SHUTDOWN_DRAIN_DELAY: wait after /readyz flips before closing the listener.
  # Whole seconds only ("5s", "5", "0"): the chart adds it to the grace period
  # floor below.
  shutdownDrainDelay: "5s"

# The chart refuses to render unless database.url or database.existingSecret is
# set. DATABASE_URL always comes from a Secret (secretKeyRef).
database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same Secret, of a DIRECT (non-pooled) connection string used
  # only for the boot migrations. optional: true on the secretKeyRef, so a
  # Secret without the key still starts the pod (the binary falls back to
  # DATABASE_URL).
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"

# The ship-to snapshot key (SHIP_TO_ENCRYPTION_KEY: base64 of 32 bytes) and the
# stopKey HMAC secret (STOP_KEY_SECRET: at least 16 bytes). Both REQUIRED, both
# from a Secret: crypto.existingSecret, or both inline values (the chart then
# creates the Secret). Never in the ConfigMap, never in a log.
crypto:
  existingSecret: ""
  shipToEncryptionKeyKey: "SHIP_TO_ENCRYPTION_KEY"
  stopKeySecretKey: "STOP_KEY_SECRET"
  shipToEncryptionKey: ""
  stopKeySecret: ""

# KAFKA_BROKERS is MANDATORY (relay, consumers, /readyz); comma-separated.
kafka:
  brokers: ""

# Observability (ADR 0008): the fleet pipeline is pod --OTLP/gRPC--> Collector
# --> Jaeger (traces) and Prometheus (metrics); logs are stdout JSON for Alloy
# and Loki. Export never blocks, so a Collector that is down costs telemetry and
# nothing else, but otel.enabled=false renders no OTEL_* env at all (the binaries
# then fall back to localhost:4317). serviceName is OTEL_SERVICE_NAME of the api;
# the mcp component gets "<serviceName>-mcp". SERVICE_VERSION is the image tag
# (appVersion when empty), ENVIRONMENT is `environment`.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "shipping-and-tracking"

# ENVIRONMENT of the api: deployment.environment.name on every span, metric and
# log of the api. (mcp.environment sets the same for the mcp component.)
environment: "production"

# Extra env vars appended to the api container as a raw list. The chart refuses
# EVENT_PUBLISHER other than "kafka", any *_MODE variable and any variable the
# chart renders itself (the OTEL_* / SERVICE_VERSION / ENVIRONMENT quartet).
extraEnv: []

# The Postgres dial at boot is wrapped in a bounded retry; periodSeconds *
# failureThreshold is the window before the kubelet gives up.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Shutdown is sequential (cmd/api/main.go): SHUTDOWN_DRAIN_DELAY (default 5s) +
# HTTP drain bound 10s + consumers and jobs drain bound 10s + outbox relay
# drain bound 10s = 35s with the default delay. The chart refuses a grace
# period that is not GREATER than 30s + the drain delay.
terminationGracePeriodSeconds: 45

# The read-only MCP server (cmd/mcp, ADR 0006): Streamable HTTP on :8090,
# tool get_journey over the same Postgres the api owns. It runs the boot
# migrations itself, dials no Kafka, runs no consumer, relay or job, and has
# no auth (fleet-wide revert 2026-09-11).
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"                  # MCP_ADDR
  # SERVICE_VERSION / ENVIRONMENT: the labels cmd/mcp reports at boot and puts on
  # its telemetry. serviceVersion empty = the image tag (appVersion when empty),
  # like the api; set it only to override.
  serviceVersion: ""
  environment: "production"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Kong exposure: /api/mcp/shipping-and-tracking -> Service :8090, prefix
  # rewritten to /mcp. Needs the Gateway parentRef from warehouse-infra.
  route:
    enabled: false
    path: "/api/mcp/shipping-and-tracking"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# The read-only A2A server (cmd/a2a, ADR 0009): Agent2Agent JSON-RPC on :8093,
# skill get_journey over the same Postgres the api owns, the Agent Card at
# /.well-known/agent-card.json. It runs the boot migrations itself, dials no
# Kafka, runs no consumer, relay or job, and has no auth (fleet-wide revert
# 2026-09-11). Default OFF: A2A carries delegation only, never data sync.
a2a:
  enabled: false
  replicaCount: 1
  httpAddr: ":8093"                  # A2A_ADDR
  # A2A_AGENT_URL: the absolute http(s) URL the Agent Card advertises. Empty =
  # this component's own in-cluster Service DNS name,
  # http://<fullname>-a2a.<namespace>.svc.cluster.local:<service.port>/
  agentUrl: ""
  # SERVICE_VERSION / ENVIRONMENT: the labels cmd/a2a reports at boot and puts on
  # its telemetry (the version is also the Agent Card's). serviceVersion empty =
  # the image tag (appVersion when empty), like the api; set it only to override.
  serviceVersion: ""
  environment: "production"
  service:
    type: ClusterIP
    port: 8093
    targetPort: 8093
  # Kong exposure: /api/a2a/shipping-and-tracking -> Service :8093, prefix
  # rewritten to /. Needs the Gateway parentRef from warehouse-infra.
  route:
    enabled: false
    path: "/api/a2a/shipping-and-tracking"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# web/ (shipping_mfe): the Module Federation remote served by its own nginx
# pod, reached through warehouse-infra's Nginx web gateway at
# /mfes/shipping-and-tracking/ (ADR 0007). Never routed by this chart;
# ClusterIP only. The Deployment renders NO env: nothing about the remote is
# configured in the cluster.
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/shipping-and-tracking-frontend
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 80
    targetPort: 8080
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
