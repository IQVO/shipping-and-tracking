# Non-secret configuration of the api component, mounted with envFrom (the
# explicit env entries of the Deployment win for the same key); the Deployment's
# checksum/config annotation rolls the pods when it changes. Every key is a
# variable cmd/api reads (tests/render_test.sh). DATABASE_URL, the ship-to
# encryption key and the stopKey secret never land here: they live in Secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shipping-and-tracking.fullname" . }}
  labels:
    {{- include "shipping-and-tracking.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  EVENT_PUBLISHER: {{ .Values.config.eventPublisher | quote }}
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  CUSTOMER_ORDERING_URL: {{ .Values.config.customerOrderingUrl | quote }}
  {{- with .Values.config.customerOrderingTimeout }}
  CUSTOMER_ORDERING_TIMEOUT: {{ . | quote }}
  {{- end }}
  VENDOR_CONSUMER_GROUP: {{ .Values.config.vendorConsumerGroup | quote }}
  LINEHAUL_CONSUMER_GROUP: {{ .Values.config.linehaulConsumerGroup | quote }}
  LASTMILE_CONSUMER_GROUP: {{ .Values.config.lastmileConsumerGroup | quote }}
  CATALOG_CONSUMER_GROUP: {{ .Values.config.catalogConsumerGroup | quote }}
  {{- with .Values.config.outboxRelayInterval }}
  OUTBOX_RELAY_INTERVAL: {{ . | quote }}
  {{- end }}
  OUTBOX_MAX_ATTEMPTS: {{ .Values.config.outboxMaxAttempts | quote }}
  {{- with .Values.config.silenceSweepInterval }}
  SILENCE_SWEEP_INTERVAL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.housekeepingInterval }}
  HOUSEKEEPING_INTERVAL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.shutdownDrainDelay }}
  SHUTDOWN_DRAIN_DELAY: {{ . | quote }}
  {{- end }}
