{{- if not .Values.crypto.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shipping-and-tracking.cryptoSecretName" . }}
  labels:
    {{- include "shipping-and-tracking.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.crypto.shipToEncryptionKeyKey }}: {{ .Values.crypto.shipToEncryptionKey | quote }}
  {{ .Values.crypto.stopKeySecretKey }}: {{ .Values.crypto.stopKeySecret | quote }}
{{- end }}
