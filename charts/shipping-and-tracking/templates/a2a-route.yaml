{{- if and .Values.a2a.enabled .Values.a2a.route.enabled -}}
{{- /*
A2A exposure through Kong (fleet decision 2026-10-13: Kong config lives in
the application charts, not warehouse-infra Terraform).

Host contract: /api/a2a/<context> -> Service <context>-a2a:8093, prefix
rewritten to / (so the JSON-RPC endpoint answers at the route path itself and
the Agent Card stays reachable at <route path>/.well-known/agent-card.json;
healthz deliberately stays off the host -- it is a Kubernetes probe concern,
not a public endpoint).

NO auth plugin -- endpoints are unauthenticated by fleet-wide decision
(revert 2026-09-11). This chart carries no KongPlugin of its own; when the
environment's gateway attaches plugins by annotation, add them on this
object, never an auth one.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "shipping-and-tracking.a2aFullname" . }}
  labels:
    {{- include "shipping-and-tracking.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  parentRefs:
    {{- range .Values.a2a.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.a2a.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "shipping-and-tracking.a2aFullname" . }}
          port: {{ .Values.a2a.service.port }}
{{- end }}
